[project]
name = "aiogram-rabbitmq-mongodb-redis"
version = "0.1.0"
description = ""
requires-python = ">=3.12,<4.0"
dependencies = [
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "punq (>=0.9.0,<0.10.0)"
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "faker (>=40.37.0,<41.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)"
]
lints = [
    "pre-commit (>=4.6.2,<5.0.0)",
    "ruff (>=0.16.6,<0.17.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py312" # Укажите вашу версию Python
src = ["src"]
exclude = [".git", ".idea", ".vscode", "venv", ".venv", "alembic"]

[tool.ruff.lint]
select = [
    "F",   # Pyflakes (заменяет autoflake)
    "E", "W", # pycodestyle (базовый flake8)
    "I",   # isort
    "A",   # flake8-builtins
    "COM", # flake8-commas
    "T10", # flake8-debugger
    "C4",  # flake8-comprehensions
    "ERA", # flake8-eradicate
    "S", # dlint
]
ignore = [
    "COM812",
    "S101",
]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "aiogram", "third-party", "first-party", "local-folder"]
known-first-party = ["src"]

[tool.ruff.lint.isort.sections]
"aiogram" = ["aiogram", "aiogram_dialog"]
